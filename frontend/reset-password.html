<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — PromptCraft</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Override hero centering for this simple page */
      #screen-auth {
        justify-content: center;
        align-items: center;
      }
      .reset-card {
        max-width: 420px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="screen-auth" class="screen active">
      <div class="container reset-card">
        <div style="margin-bottom: 24px; text-align: center">
          <span class="logo">✦ PromptCraft</span>
        </div>

        <!-- Reset form -->
        <div id="view-reset" class="card">
          <div>
            <p style="font-size: 16px; font-weight: 600; color: var(--text)">
              Set a new password
            </p>
            <p style="font-size: 13px; color: var(--muted); margin-top: 4px">
              Must be at least 6 characters.
            </p>
          </div>
          <div class="field">
            <label>New Password</label>
            <input type="password" id="new-password" placeholder="••••••••" />
          </div>
          <div class="field">
            <label>Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              placeholder="••••••••"
            />
          </div>
          <p class="auth-error hidden" id="reset-error"></p>
          <button id="reset-btn" onclick="handleReset()">
            Update Password →
          </button>
          <a href="/" style="text-decoration: none; text-align: center">
            <p class="forgot-link">← Back to login</p>
          </a>
        </div>

        <!-- Success view -->
        <div
          id="view-success"
          class="card hidden"
          style="text-align: center; gap: 12px"
        >
          <p style="font-size: 28px">✓</p>
          <p style="font-size: 16px; font-weight: 600; color: var(--text)">
            Password updated
          </p>
          <p style="font-size: 13px; color: var(--muted)">
            You can now log in with your new password.
          </p>
          <a href="/" style="text-decoration: none">
            <button style="width: 100%">Go to Login →</button>
          </a>
        </div>

        <!-- Invalid token view -->
        <div
          id="view-invalid"
          class="card hidden"
          style="text-align: center; gap: 12px"
        >
          <p style="font-size: 28px">✕</p>
          <p style="font-size: 16px; font-weight: 600; color: #dc2626">
            Link invalid or expired
          </p>
          <p style="font-size: 13px; color: var(--muted)">
            This reset link has expired or already been used. Please request a
            new one.
          </p>
          <a href="/" style="text-decoration: none">
            <button class="btn-secondary" style="width: 100%">
              Back to Login
            </button>
          </a>
        </div>
      </div>
    </div>

    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p id="loader-text">Updating password...</p>
    </div>

    <script>
      const token = new URLSearchParams(window.location.search).get("token");

      // No token in URL — show invalid view immediately
      if (!token) {
        document.getElementById("view-reset").classList.add("hidden");
        document.getElementById("view-invalid").classList.remove("hidden");
      }

      function showLoader() {
        document.getElementById("loader").classList.remove("hidden");
      }

      function hideLoader() {
        document.getElementById("loader").classList.add("hidden");
      }

      function showError(msg) {
        const el = document.getElementById("reset-error");
        el.textContent = msg;
        el.classList.remove("hidden");
      }

      function hideError() {
        document.getElementById("reset-error").classList.add("hidden");
      }

      async function handleReset() {
        const newPass = document.getElementById("new-password").value;
        const confirmPass = document.getElementById("confirm-password").value;

        hideError();

        if (!newPass || newPass.length < 6) {
          showError("Password must be at least 6 characters.");
          return;
        }
        if (newPass !== confirmPass) {
          showError("Passwords do not match.");
          return;
        }

        const btn = document.getElementById("reset-btn");
        btn.disabled = true;
        btn.textContent = "Updating...";

        showLoader();
        try {
          const res = await fetch("/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, new_password: newPass }),
          });
          const data = await res.json();
          hideLoader();

          if (res.status === 400) {
            // Token expired or already used — show invalid view
            document.getElementById("view-reset").classList.add("hidden");
            document.getElementById("view-invalid").classList.remove("hidden");
            return;
          }

          if (!res.ok) {
            // Other errors — show inline, let user retry
            showError(data.detail || "Something went wrong. Please try again.");
            btn.disabled = false;
            btn.textContent = "Update Password →";
            return;
          }

          // Success
          document.getElementById("view-reset").classList.add("hidden");
          document.getElementById("view-success").classList.remove("hidden");
        } catch (err) {
          hideLoader();
          showError(
            "Network error. Please check your connection and try again.",
          );
          btn.disabled = false;
          btn.textContent = "Update Password →";
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleReset();
      });
    </script>
  </body>
</html>
